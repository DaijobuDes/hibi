appId: com.ryanaque.hibi
productName: hibi
directories:
  output: release
files:
  - out/**/*
  - package.json
asar: true
extraResources:
  - from: docs/licenses
    to: licenses/colorschemes
    filter: ["*.md"]
  - from: node_modules/geist/LICENSE.txt
    to: licenses/geist.txt
npmRebuild: false
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
mac:
  target: [dmg, zip]
win:
  target: [nsis]
linux:
  target: [AppImage]
