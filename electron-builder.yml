appId: com.hibi.desktop
productName: hibi
directories:
  output: release
files:
  - out/**/*
  - package.json
asar: true
npmRebuild: false
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
mac:
  target: [dmg, zip]
win:
  target: [nsis]
linux:
  target: [AppImage]
