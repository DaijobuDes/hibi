appId: com.ryanaque.hibi
productName: hibi
directories:
  output: release
files:
  - out/**/*
  - package.json
asar: true
extraResources:
  - from: build
    to: icons
    filter: ["icon-*.png"]
  - from: node_modules/electron/dist/LICENSES.chromium.html
    to: licenses/electron-third-party.html
  - from: docs/licenses
    to: licenses/colorschemes
    filter: ["*.md"]
  - from: node_modules/geist/LICENSE.txt
    to: licenses/geist.txt
npmRebuild: false
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
mac:
  icon: build/icon.icns
  target: [dmg, zip]
win:
  icon: build/icon.ico
  target: [nsis]
linux:
  icon: build/icon-linux.png
  target: [AppImage]
