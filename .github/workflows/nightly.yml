name: nightly
on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nightly
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      changed: ${{ steps.release.outputs.changed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - id: release
        run: node scripts/nightly.mjs prepare
  build:
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
            args: --linux --x64
          - os: windows-latest
            platform: windows-x64
            args: --win --x64
          - os: macos-latest
            platform: macos-arm64
            args: --mac --arm64 -c.mac.identity=-
          - os: macos-15-intel
            platform: macos-x64
            args: --mac --x64 -c.mac.identity=-
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: node --test tests/addon-download.test.mjs
      - run: npm run check
        if: runner.os != 'Linux'
      - run: dbus-run-session -- xvfb-run --auto-servernum --server-args='-screen 0 1920x1080x24 -nolisten tcp' npm run check
        if: runner.os == 'Linux'
      - name: Package installers
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          BUILD_ARGS: ${{ matrix.args }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          read -r -a build_args <<< "$BUILD_ARGS"
          npx electron-builder --publish never "${build_args[@]}" \
            -c.extraMetadata.version="$RELEASE_VERSION" \
            -c.buildVersion="${RELEASE_VERSION%%-*}.$GITHUB_RUN_NUMBER" \
            "-c.artifactName=hibi-\${version}-\${os}-\${arch}.\${ext}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-${{ matrix.platform }}
          retention-days: 1
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: nightly-*
          path: installers
          merge-multiple: true
      - name: Publish prerelease with commit changelog
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          SHA: ${{ needs.prepare.outputs.sha }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          node scripts/nightly.mjs notes "$VERSION" > release-notes.md
          (cd installers && sha256sum ./* > SHA256SUMS.txt)
          if gh release view "$TAG" >/dev/null 2>&1; then
            test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = true
            test "$(gh release view "$TAG" --json targetCommitish --jq .targetCommitish)" = "$SHA"
          else
            gh release create "$TAG" --target "$SHA" --title "hibi $VERSION" --notes-file release-notes.md --draft --prerelease
          fi
          gh release upload "$TAG" installers/* --clobber
          gh release edit "$TAG" --notes-file release-notes.md --draft=false --prerelease --latest=false
