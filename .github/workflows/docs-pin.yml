name: pin published docs

on:
  repository_dispatch:
    types: [hibi-docs-published]
  workflow_dispatch:
    inputs:
      docs_sha:
        description: full hibigarden/docs commit that just published
        required: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: docs-pin
  cancel-in-progress: false

jobs:
  pin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: resolve published revision
        id: rev
        env:
          EVENT: ${{ github.event_name }}
          INPUT_SHA: ${{ inputs.docs_sha }}
          PAYLOAD_SHA: ${{ github.event.client_payload.docs_sha }}
        run: |
          set -euo pipefail
          sha=$PAYLOAD_SHA
          if [[ $EVENT == workflow_dispatch ]]; then
            sha=$INPUT_SHA
          fi
          if [[ ! $sha =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error::docs_sha must be a full commit SHA'
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: published commit is still docs main
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          DOCS_SHA: ${{ steps.rev.outputs.sha }}
        run: |
          set -euo pipefail
          main=$(gh api repos/hibigarden/docs/commits/main --jq .sha)
          if [[ $main != "$DOCS_SHA" ]]; then
            echo "::notice::hibigarden/docs main is $main, not $DOCS_SHA; not pinning"
            echo 'pin=false' >> "$GITHUB_OUTPUT"
          else
            echo 'pin=true' >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.current.outputs.pin == 'true'
        with:
          ref: main

      - uses: DeterminateSystems/nix-installer-action@main
        if: steps.current.outputs.pin == 'true'

      - name: open a pull request for the published pin
        if: steps.current.outputs.pin == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DOCS_SHA: ${{ steps.rev.outputs.sha }}
        run: |
          set -euo pipefail
          json=$(nix shell nixpkgs#nix-prefetch-github --command \
            nix-prefetch-github --rev "$DOCS_SHA" --json hibigarden docs)
          hash=$(printf '%s\n' "$json" | sed -n 's/^[[:space:]]*"hash": "\(sha256-[A-Za-z0-9+/=]*\)".*/\1/p')
          if [[ ! $hash =~ ^sha256-[A-Za-z0-9+/]+=$ ]]; then
            echo '::error::nix-prefetch-github did not return a fetchFromGitHub hash'
            printf '%s\n' "$json"
            exit 1
          fi

          printf '%s\n' "$DOCS_SHA" > docs-revision
          HASH=$hash node --input-type=module -e '
            import { readFileSync, writeFileSync } from "node:fs"
            const hash = process.env.HASH
            const path = "nix/package.nix"
            const source = readFileSync(path, "utf8")
            const marker = "hash = \"" + hash + "\";"
            const next = source.replace(/hash = "sha256-[^"]+";/, marker)
            if (next.split(marker).length !== 2) {
              console.error("nix/package.nix has no single fetchFromGitHub hash assignment")
              process.exit(1)
            }
            writeFileSync(path, next)
          '

          git add -- docs-revision nix/package.nix
          if git diff --cached --quiet; then
            echo "::notice::main already pins $DOCS_SHA at $hash"
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          branch="docs-pin/${DOCS_SHA}"
          ref="refs/heads/${branch}"
          # This job may publish only its own docs-pin/<sha> ref. It never
          # merges, and it never pushes or force-pushes any other branch.
          if [[ -z ${GITHUB_REPOSITORY:-} || $ref != "refs/heads/docs-pin/${DOCS_SHA}" || ! $ref =~ ^refs/heads/docs-pin/[0-9a-f]{40}$ ]]; then
            echo "::error::refusing to publish ${ref}; only this bot's docs-pin branch is allowed"
            exit 1
          fi

          is_actions_bot() {
            [[ $1 == 'app/github-actions' || $1 == 'github-actions[bot]' ]]
          }

          pr_err=$(mktemp)
          if pr_meta=$(gh pr view "$branch" --repo "$GITHUB_REPOSITORY" --json author,headRefName,headRepository --jq '"\(.author.login)\t\(.headRefName)\t\(.headRepository.nameWithOwner)"' 2>"$pr_err"); then
            IFS=$'\t' read -r pr_author pr_head pr_repo <<<"$pr_meta"
            if [[ $pr_repo != "$GITHUB_REPOSITORY" || $pr_head != "$branch" ]] || ! is_actions_bot "$pr_author"; then
              echo "::error::refusing to update ${ref}; pull request is ${pr_author} ${pr_repo}#${pr_head}"
              exit 1
            fi
          elif [[ ! -s "$pr_err" ]] || ! grep -q 'no pull requests found' "$pr_err"; then
            echo "::error::could not read the pull request for ${branch}"
            cat "$pr_err"
            exit 1
          fi
          rm -f "$pr_err"

          remote_sha=""
          if remote_line=$(git ls-remote --exit-code origin "$ref"); then
            if [[ $remote_line == *$'\n'* ]]; then
              echo "::error::refusing to force-push ${ref}; expected one remote tip"
              exit 1
            fi
            remote_sha=${remote_line%%[[:space:]]*}
            git fetch --no-tags origin "$ref"
            fetched=$(git rev-parse FETCH_HEAD)
            if [[ $fetched != "$remote_sha" || ! $remote_sha =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::refusing to force-push ${ref}; origin moved while reading it"
              exit 1
            fi
            remote_name=$(git log -1 --format='%an' "$remote_sha")
            remote_email=$(git log -1 --format='%ae' "$remote_sha")
            if [[ $remote_name != 'github-actions[bot]' || $remote_email != '41898282+github-actions[bot]@users.noreply.github.com' ]]; then
              echo "::error::refusing to force-push ${ref}; tip ${remote_sha} is not a github-actions[bot] commit"
              exit 1
            fi
          fi

          git checkout -B "$branch"
          if [[ $(git branch --show-current) != "$branch" ]]; then
            echo "::error::refusing to commit on $(git branch --show-current)"
            exit 1
          fi
          git commit -m "chore(nix): pin published docs ${DOCS_SHA:0:12}" \
            -m "Point docs-revision and the fetchFromGitHub hash at the documentation commit that just published."

          if [[ $(git branch --show-current) != "$branch" || $ref != "refs/heads/docs-pin/${DOCS_SHA}" ]]; then
            echo "::error::refusing to push ${ref}"
            exit 1
          fi
          # Empty lease means the ref must not exist yet. A recorded tip
          # updates only that docs-pin ref, and only while it is still there.
          git push --force-with-lease="${ref}:${remote_sha}" origin "HEAD:${ref}"

          if ! gh pr view "$branch" --repo "$GITHUB_REPOSITORY" --json number --jq .number >/dev/null 2>&1; then
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" \
              --title "chore(nix): pin published docs ${DOCS_SHA:0:12}" \
              --body "$(cat <<EOF
          Published [hibigarden/docs](https://github.com/hibigarden/docs) at \`$DOCS_SHA\`.

          This moves \`docs-revision\` and the \`fetchFromGitHub\` hash in \`nix/package.nix\` to that archive (\`$hash\`). The app keeps its current documentation snapshot until this is merged.

          The Nix workflow does not start on this branch. GitHub does not run workflows for commits pushed with the default workflow token. Push an empty commit to this branch if you want that check before merging.
          EOF
          )"
          fi

          # Supersede older pins only. Title matches are not enough: a person's
          # pull request can use the same title on some other branch.
          export DOCS_PIN_BRANCH="$branch"
          superseded=$(mktemp)
          gh api --paginate "/repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" \
            --jq '.[] | select(.head.repo.full_name == env.GITHUB_REPOSITORY) | select(.base.ref == "main") | select(.user.login == "github-actions[bot]" or .user.login == "app/github-actions") | select(.head.ref | test("^docs-pin/[0-9a-f]{40}$")) | select(.head.ref != env.DOCS_PIN_BRANCH) | "\(.number)\t\(.head.ref)"' \
            >"$superseded"
          while IFS=$'\t' read -r number head; do
            [[ -n "$number" ]] || continue
            if [[ ! $number =~ ^[0-9]+$ || ! $head =~ ^docs-pin/[0-9a-f]{40}$ || $head == "$branch" ]]; then
              echo "::error::refusing to close #${number} (${head})"
              exit 1
            fi
            close_meta=$(gh pr view "$number" --repo "$GITHUB_REPOSITORY" --json state,author,headRefName,headRepository,baseRefName --jq '"\(.state)\t\(.author.login)\t\(.headRefName)\t\(.headRepository.nameWithOwner)\t\(.baseRefName)"')
            IFS=$'\t' read -r close_state close_author close_head close_repo close_base <<<"$close_meta"
            if [[ $close_state != OPEN || $close_head != "$head" || $close_repo != "$GITHUB_REPOSITORY" || $close_base != main || ! $close_head =~ ^docs-pin/[0-9a-f]{40}$ ]] || ! is_actions_bot "$close_author"; then
              echo "::error::refusing to close #${number} (${close_author} ${close_repo}#${close_head} -> ${close_base}, ${close_state})"
              exit 1
            fi
            gh pr close "$number" --repo "$GITHUB_REPOSITORY" --comment "Superseded by ${DOCS_SHA}."
          done <"$superseded"
          rm -f "$superseded"
